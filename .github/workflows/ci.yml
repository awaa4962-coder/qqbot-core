name: CI

on:
  pull_request:
  push:
    branches: [main, master, agent/linux-server-preview]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-jm.txt
      - run: chmod 0755 "$(node -p "require('7zip-bin').path7za")"
      # CI 环境创建 dummy .env 文件（测试需要 config 模块加载不崩溃）
      - run: echo dummy > .env_mimo && echo dummy > .env_ds && echo dummy > .env_tavily && echo dummy > .env_doubao
      - run: npm run release:check
        env:
          QQBOT_JM_PYTHON: python
      - run: npm run replay:check

  image:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: Build production Linux image
        run: docker build -f deploy/linux/Dockerfile -t qqfriend-ci:smoke .
      - name: Smoke image without network or real configuration
        run: |
          docker run --rm --network none --entrypoint bash qqfriend-ci:smoke -c '
            set -e
            test ! -e /app/.env_admins
            test ! -e /app/user_memory.json
            npm run check:jm
            npm run smoke:linux
          '
